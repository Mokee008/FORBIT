# FOREST HEARTBEAT - Final Evaluation Configuration
# Rule R1, R5, R6 Enforced

system:
  name: "FOREST HEARTBEAT"
  version: "1.0.0-rc1"
  problem_track: "CL-01 Satellite Forest-Loss Alerts"

split:
  train_state: "Chhattisgarh"
  train_expansion_state: "Jharkhand"
  test_state: "Odisha"
  test_frozen_manifest: "manifests/test_frozen.sha256"
  holdout_label_year: 2024
  training_label_years: [2021, 2022, 2023]

model:
  architecture: "TemporalForecaster_UNet_Hybrid"
  params: 1929601
  random_init_seed: 42
  device: "mps"

parameters:
  harmonic_harmonics: 2
  z_score_threshold: -2.2
  min_consecutive_drops: 2
  cloud_dilation_px: 2
  conformal_alpha: 0.10 # 90% target coverage

evaluation:
  bootstrap_replicates: 500
  confidence_level: 0.95
  output_json: "results/results.json"
  runs_log: "results/runs.log"
